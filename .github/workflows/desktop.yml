name: Desktop build and release
run-name: Desktop · ${{ inputs.ref }} · ${{ inputs.platforms }} · publish=${{ inputs.publish }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit (publishing requires v<package version>)
        type: string
        required: true
        default: main
      platforms:
        description: Targets (publishing requires all)
        type: choice
        options: [all, mac-arm64, mac-x64, win-x64, linux-x64]
        default: all
      publish:
        description: Publish the verified files to GitHub Releases
        type: boolean
        default: false
      prerelease:
        description: Mark release as preview (stable requires signing credentials)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.repository }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.ref }}
  RELEASE_PLATFORMS: ${{ inputs.platforms }}
  RELEASE_PUBLISH: ${{ inputs.publish }}
  RELEASE_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve source and validate release inputs
        id: source
        run: node scripts/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test application and release rules
        run: |
          pnpm test
          pnpm test:release
      - name: Build installers
        run: pnpm dist -- --arch ${{ matrix.arch }}
        env:
          AGENT_LENS_SIGN: ${{ inputs.publish && matrix.platform != 'linux' && (!inputs.prerelease || (matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '') || (matrix.platform == 'win' && secrets.WIN_CSC_LINK != '')) }}
          CSC_LINK: ${{ inputs.publish && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.publish && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.publish && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.publish && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.publish && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ inputs.publish && matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ inputs.publish && matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Smoke test packaged desktop (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm test:desktop
      - name: Smoke test packaged desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:desktop
      - name: Web regression (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: release/${{ needs.prepare.outputs.version }}/${{ matrix.id }}/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed Web test diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: web-test-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  collect:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release/artifacts
          merge-multiple: true
      - name: Verify target coverage, provenance and hashes
        run: |
          node scripts/release.mjs assemble
          node scripts/release.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Write build summary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Agent Lens $APP_VERSION"
            echo "Source: $SOURCE_COMMIT"
            echo "Targets: $RELEASE_PLATFORMS"
            echo "Publish requested: $RELEASE_PUBLISH"
            echo "Download release-bundle for installers, SHA256SUMS and release-manifest.json."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.publish
    needs: [prepare, collect]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release/artifacts
      - name: Verify, upload draft, verify remote bytes, publish
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
