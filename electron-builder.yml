appId: studio.nullset.agent-tools-manager
productName: Agent Lens
directories:
  app: dist/package
  output: release
  buildResources: build
files:
  - dist/web/**
  - dist/desktop/**
  - package.json
  - build-info.json
  - '!**/node_modules/**'
asar: true
artifactName: Agent-Lens-${version}-${os}-${arch}.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  target: [nsis]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  executableName: agent-lens
  category: Development
  maintainer: Null Studio
  icon: build/icon.png
